[project]
name = "kaggle-automation"
version = "0.1.0"
description = "FastAPI dashboard and runner for Kaggle notebooks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "kaggle>=2.2.4",
    "tqdm>=4.70.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
pythonpath = [".", "app"]

[tool.ruff.lint]
ignore = ["BLE001", "S110"]

[tool.ruff.lint.per-file-ignores]
"tests/test_inference_script.py" = ["S102"]

